# This pipeline deletes all resources in given resource group every 24 hours. This is to prevent high Azure costs.
name: Cleanup-Resources-$(Date:yyyyMMdd)

schedules:
- cron: "*/10 0 * * *"
  displayName: Daily midnight cleanup
  branches:
    include:
      - main
  always: true

pool:
  vmImage: ubuntu-latest

parameters:
- name: excludedResourceGroups
  type: object
  default:
    - 'cloud-shell-storage-westeurope'

variables:
  - name: AZURE_SERVICE_CONNECTION
    value: 'service-connection'

stages:
- stage: DeleteResourcesStage
  displayName: 'Cleanup Resources'
  jobs:
  - job: 'DeleteResourcesJob'
    displayName: 'Delete Resources'
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Convert the excluded resource groups to JSON
          excluded=${{ parameters.excludedResourceGroup) }}

          echo "Yeah..."
          echo "$excluded"

          # List all resource groups and remove the exluded ones
          if [ -n "$excluded" ]; then
            resource_groups=$(az group list --query "[].name" -o tsv | grep -vE "^($excluded)$")
          else
            resource_groups=$(az group list --query "[].name" -o tsv)
          fi

          for rg in $resource_groups; do
            echo "Delete resources in resource group $rg"

            # List all resource IDs in the resource group
            resource_ids=$(az resource list --resource-group "$rg" --query "[].id" --output tsv)

            # Check if the list is empty
            if [ -z "$resource_ids" ]; then
              echo "No resources found in the resource group. Nothing to delete."
            else
              # Delete each resource by its ID
              echo "$resource_ids" | xargs -n 1 az resource delete --ids
            fi
          done
      displayName: 'Delete all resources in the resource groups'
