# This pipeline deletes ALL Azure resources in ALL resource groups every 24 hours. This is to prevent high Azure costs.
name: Cleanup-Resources-$(Date:yyyyMMdd)

schedules:
- cron: "*/10 0 * * *"
  displayName: Daily midnight cleanup
  branches:
    include:
      - main
  always: true

pool:
  vmImage: ubuntu-latest

variables:
  - name: AZURE_SERVICE_CONNECTION
    value: 'service-connection'

stages:
- stage: DeleteResourcesStage
  displayName: 'Cleanup Resources'
  jobs:
  - job: 'DeleteResourcesJob'
    displayName: 'Delete Resources'
    steps:
    - task: AzureCLI@2
      displayName: 'Delete all resources in the resource groups'    
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptPath: ../scripts/resource-cleaner.sh
